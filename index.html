<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Holdings Widget</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        
        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        #holdingWidget {
            border: 2px solid #333;
            padding: 20px;
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        h3 {
            margin-top: 0;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .refresh-timer {
            font-size: 12px;
            color: #999;
            font-weight: normal;
        }
        
        .refresh-button {
            padding: 6px 12px;
            background: #007368;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 10px;
            transition: 0.3s;
        }
        
        .refresh-button:hover {
            background: #005c54;
        }
        
        .holding-item {
            margin: 12px 0;
            padding: 10px;
            background: #f9f9f9;
            border-left: 4px solid #007368;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .holding-item-left {
            flex: 1;
        }
        
        .holding-item-link {
            text-decoration: none;
            color: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .holding-item-link:hover {
            text-decoration: underline;
        }
        
        .symbol {
            font-weight: bold;
            font-size: 18px;
            color: #007368;
        }
        
        .amount {
            font-weight: bold;
            color: #333;
            margin: 0 8px;
        }
        
        .value {
            color: #666;
            font-size: 13px;
            margin-top: 4px;
        }
        
        .subtotal {
            font-weight: bold;
            color: #007368;
            font-size: 14px;
            margin-top: 4px;
        }
        
        .delete-coin {
            padding: 4px 8px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 5px;
        }
        
        .delete-coin:hover {
            background: #dc2626;
        }
        
        .price-change {
            font-size: 12px;
            font-weight: bold;
            margin-top: 2px;
        }
        
        .price-up {
            color: #10b981;
        }
        
        .price-down {
            color: #ef4444;
        }
        
        .exchange-link {
            color: #0066cc;
            font-size: 11px;
            margin-top: 4px;
            cursor: pointer;
        }
        
        .exchange-link:hover {
            text-decoration: underline;
        }
        
        .total {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px solid #eee;
            font-size: 18px;
            font-weight: bold;
            color: #007368;
        }
        
        .cny-value {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
        
        .loading {
            color: #999;
            font-style: italic;
        }
        
        .link-icon {
            font-size: 12px;
        }
        
        /* Settings Panel */
        #settingsPanel {
            border: 2px solid #333;
            padding: 20px;
            width: 100%;
            max-width: 300px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: none; /* Hidden by default */
        }
        
        #settingsPanel.show {
            display: block;
        }
        
        .settings-toggle {
            padding: 8px 16px;
            background: #666;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
        }
        
        .settings-toggle:hover {
            background: #555;
        }
        
        .add-coin-section {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
        
        .add-coin-title {
            font-size: 14px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        
        .add-coin-input {
            width: 100%;
            padding: 6px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
            margin-bottom: 8px;
        }
        
        .btn-add-coin {
            width: 100%;
            padding: 8px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .btn-add-coin:hover {
            background: #059669;
        }
        
        .settings-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .setting-item {
            margin-bottom: 15px;
        }
        
        .setting-label {
            font-size: 14px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        
        .setting-input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .setting-input:focus {
            outline: none;
            border-color: #007368;
            box-shadow: 0 0 5px rgba(0,115,104,0.3);
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .btn-save {
            background: #007368;
            color: white;
        }
        
        .btn-save:hover {
            background: #005c54;
        }
        
        .btn-reset {
            background: #e0e0e0;
            color: #333;
        }
        
        .btn-reset:hover {
            background: #d0d0d0;
        }
        
        /* Mobile Responsive Styles */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .container {
                gap: 15px;
            }
            
            #holdingWidget {
                padding: 15px;
            }
            
            h3 {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            
            h3 > div {
                width: 100%;
                justify-content: flex-end;
            }
            
            .holding-item {
                font-size: 14px;
            }
            
            .symbol {
                font-size: 16px;
            }
            
            .total {
                font-size: 16px;
            }
            
            #settingsPanel {
                max-width: 100%;
                padding: 15px;
            }
            
            .settings-toggle {
                width: 100%;
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 5px;
            }
            
            #holdingWidget {
                padding: 12px;
                border-width: 1px;
            }
            
            h3 {
                font-size: 16px;
            }
            
            .refresh-button {
                padding: 5px 10px;
                font-size: 11px;
            }
            
            .holding-item {
                padding: 8px;
                font-size: 13px;
            }
            
            .symbol {
                font-size: 15px;
            }
            
            .value {
                font-size: 12px;
            }
            
            .price-change {
                font-size: 11px;
            }
            
            .total {
                font-size: 15px;
            }
            
            .cny-value {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="holdingWidget">
            <h3>
                💰 My Crypto Holdings
                <div style="display: flex; align-items: center;">
                    <button class="refresh-button" onclick="manualRefresh()">🔄 Refresh Now</button>
                </div>
            </h3>
            
            <div id="holdingsContainer">
                <!-- Holdings will be dynamically rendered here -->
            </div>
            
            <div class="total">
                Total Value (USD): <span id="total_value" class="loading">Loading...</span>
                <div class="cny-value" id="total_cny"></div>
            </div>
            
            <button class="settings-toggle" onclick="toggleSettings()">⚙️ Settings</button>
        </div>
        
        <div id="settingsPanel">
            <div class="settings-title">⚙️ Settings</div>
            
            <div id="settingsContainer">
                <!-- Settings will be dynamically rendered here -->
            </div>
            
            <div class="button-group">
                <button class="btn btn-save" onclick="saveSettings()">Save</button>
                <button class="btn btn-reset" onclick="resetSettings()">Reset</button>
            </div>
            
            <div class="add-coin-section">
                <div class="add-coin-title">➕ Add New Coin</div>
                <input type="text" id="new_coin_symbol" class="add-coin-input" placeholder="Coin Symbol (e.g., BTC)">
                <input type="text" id="new_coin_id" class="add-coin-input" placeholder="CoinGecko ID (e.g., bitcoin)">
                <input type="number" id="new_coin_amount" class="add-coin-input" placeholder="Amount">
                <button class="btn-add-coin" onclick="addNewCoin()">Add Coin</button>
            </div>
        </div>
    </div>

    <script>
        const USD_TO_CNY_RATE = 7.2; // Approximate exchange rate
        let holdings = {
            'zcash': { amount: 220, id: 'zec', symbol: 'ZEC' },
            'bitcoin': { amount: 1.04, id: 'btc', symbol: 'BTC' },
            'ripple': { amount: 5000, id: 'xrp', symbol: 'XRP' },
            'siacoin': { amount: 2000000, id: 'sc', symbol: 'SC' }
        };
        let previousPrices = {}; // Store previous prices for comparison
        let lastUpdateTime = {}; // Store last update timestamp for each coin
        let updateIntervals = {}; // Store interval timers for each coin

        function loadSettings() {
            const saved = localStorage.getItem('cryptoHoldings');
            if (saved) {
                holdings = JSON.parse(saved);
            }
            
            // Load previous prices from localStorage
            const savedPrices = localStorage.getItem('previousPrices');
            if (savedPrices) {
                previousPrices = JSON.parse(savedPrices);
            }
            
            renderHoldings();
            renderSettings();
        }
        
        function renderHoldings() {
            const container = document.getElementById('holdingsContainer');
            container.innerHTML = '';
            
            Object.entries(holdings).forEach(([coinId, data]) => {
                const holdingDiv = document.createElement('div');
                holdingDiv.className = 'holding-item';
                holdingDiv.id = `holding_${data.id}`;
                
                holdingDiv.innerHTML = `
                    <div class="holding-item-left">
                        <a href="https://www.binance.com/trade/${data.symbol}_USDT" target="_blank" class="holding-item-link">
                            <span class="symbol">${data.symbol}</span>: <span class="amount" id="${data.id}_amount">${data.amount}</span>
                            <span class="link-icon">🔗</span>
                        </a>
                        <div class="value" id="${data.id}_price" class="loading">Loading...</div>
                        <div class="subtotal" id="${data.id}_subtotal"></div>
                        <div class="price-change" id="${data.id}_change"></div>
                        <div class="value" id="${data.id}_updated" style="font-size: 11px; color: #999;"></div>
                        <button class="delete-coin" onclick="deleteCoin('${coinId}')">🗑️ Delete</button>
                        <div class="exchange-link" onclick="window.open('https://www.binance.com/trade/${data.symbol}_USDT', '_blank')">
                            📊 Trade on Binance
                        </div>
                    </div>
                `;
                
                container.appendChild(holdingDiv);
            });
        }
        
        function renderSettings() {
            const container = document.getElementById('settingsContainer');
            container.innerHTML = '';
            
            Object.entries(holdings).forEach(([coinId, data]) => {
                const settingDiv = document.createElement('div');
                settingDiv.className = 'setting-item';
                
                settingDiv.innerHTML = `
                    <label class="setting-label">${data.symbol} Amount</label>
                    <input type="number" id="setting_${data.id}" class="setting-input" value="${data.amount}">
                `;
                
                container.appendChild(settingDiv);
            });
        }

        function saveSettings() {
            Object.keys(holdings).forEach(coinId => {
                const inputId = `setting_${holdings[coinId].id}`;
                const inputElement = document.getElementById(inputId);
                if (inputElement) {
                    holdings[coinId].amount = parseFloat(inputElement.value) || 0;
                }
            });
            
            localStorage.setItem('cryptoHoldings', JSON.stringify(holdings));
            renderHoldings();
            updateValues();
            alert('Settings saved successfully!');
        }

        function resetSettings() {
            holdings = {
                'zcash': { amount: 220, id: 'zec', symbol: 'ZEC' },
                'bitcoin': { amount: 1.04, id: 'btc', symbol: 'BTC' },
                'ripple': { amount: 5000, id: 'xrp', symbol: 'XRP' },
                'siacoin': { amount: 2000000, id: 'sc', symbol: 'SC' }
            };
            
            localStorage.setItem('cryptoHoldings', JSON.stringify(holdings));
            renderHoldings();
            renderSettings();
            updateValues();
            alert('Settings reset to defaults!');
        }
        
        function addNewCoin() {
            const symbol = document.getElementById('new_coin_symbol').value.trim().toUpperCase();
            const coinGeckoId = document.getElementById('new_coin_id').value.trim().toLowerCase();
            const amount = parseFloat(document.getElementById('new_coin_amount').value) || 0;
            
            if (!symbol || !coinGeckoId || amount <= 0) {
                alert('Please fill in all fields with valid values');
                return;
            }
            
            // Check if coin already exists
            if (holdings[coinGeckoId]) {
                alert('This coin already exists!');
                return;
            }
            
            // Generate a unique short ID for the coin
            const shortId = symbol.toLowerCase().substring(0, 3) + '_' + Date.now().toString().slice(-4);
            
            holdings[coinGeckoId] = {
                amount: amount,
                id: shortId,
                symbol: symbol
            };
            
            localStorage.setItem('cryptoHoldings', JSON.stringify(holdings));
            
            // Clear inputs
            document.getElementById('new_coin_symbol').value = '';
            document.getElementById('new_coin_id').value = '';
            document.getElementById('new_coin_amount').value = '';
            
            renderHoldings();
            renderSettings();
            updateValues();
            alert(`${symbol} added successfully!`);
        }
        
        function deleteCoin(coinId) {
            const coinData = holdings[coinId];
            if (confirm(`Are you sure you want to delete ${coinData.symbol}?`)) {
                delete holdings[coinId];
                localStorage.setItem('cryptoHoldings', JSON.stringify(holdings));
                
                // Clear intervals for this coin
                if (updateIntervals[coinId]) {
                    clearInterval(updateIntervals[coinId]);
                    delete updateIntervals[coinId];
                }
                
                renderHoldings();
                renderSettings();
                updateValues();
            }
        }

        // Format price with appropriate decimal places
        function formatPrice(price) {
            if (price < 0.01) {
                // For very small prices like SC, use up to 6 decimal places
                return price.toFixed(6);
            } else if (price < 1) {
                // For prices less than $1, use 4 decimal places
                return price.toFixed(4);
            } else if (price < 100) {
                // For prices less than $100, use 2 decimal places
                return price.toFixed(2);
            } else {
                // For larger prices, use 2 decimal places
                return price.toFixed(2);
            }
        }
        
        // Format elapsed time since last update
        function formatElapsedTime(timestamp) {
            if (!timestamp) return '';
            
            const now = Date.now();
            const elapsed = Math.floor((now - timestamp) / 1000); // seconds
            
            if (elapsed < 60) {
                return `Updated ${elapsed}s ago`;
            } else if (elapsed < 3600) {
                const minutes = Math.floor(elapsed / 60);
                return `Updated ${minutes}m ago`;
            } else {
                const hours = Math.floor(elapsed / 3600);
                return `Updated ${hours}h ago`;
            }
        }
        
        // Start updating elapsed time display for all coins
        function startElapsedTimeUpdates() {
            // Clear any existing intervals
            Object.values(updateIntervals).forEach(interval => clearInterval(interval));
            updateIntervals = {};
            
            // Update elapsed time for each coin every second
            Object.keys(holdings).forEach(symbol => {
                const data = holdings[symbol];
                updateIntervals[symbol] = setInterval(() => {
                    if (lastUpdateTime[symbol]) {
                        document.getElementById(`${data.id}_updated`).innerText = 
                            formatElapsedTime(lastUpdateTime[symbol]);
                    }
                }, 1000);
            });
        }

        async function fetchPrice(symbol, retryCount = 0) {
            const maxRetries = 5; // 1s, 2s, 4s, 8s, 16s
            const delays = [1000, 2000, 4000, 8000, 16000]; // Exponential backoff delays in milliseconds
            
            try {
                const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${symbol}&vs_currencies=usd`);
                const data = await res.json();
                
                if (!data[symbol]) {
                    console.warn(`Price data not found for ${symbol}`);
                    console.warn(`API Response:`, data);
                    
                    // Retry with exponential backoff if we haven't exceeded max retries
                    if (retryCount < maxRetries) {
                        const delay = delays[retryCount];
                        console.log(`Retrying ${symbol} in ${delay/1000}s... (attempt ${retryCount + 1}/${maxRetries})`);
                        await new Promise(resolve => setTimeout(resolve, delay));
                        return fetchPrice(symbol, retryCount + 1);
                    }
                    
                    return 0;
                }
                
                const price = data[symbol].usd || 0;
                console.log(`${symbol}: $${price}${retryCount > 0 ? ` (succeeded after ${retryCount} retries)` : ''}`);
                return price;
            } catch (error) {
                console.error(`Error fetching price for ${symbol}:`, error);
                
                // Retry with exponential backoff if we haven't exceeded max retries
                if (retryCount < maxRetries) {
                    const delay = delays[retryCount];
                    console.log(`Retrying ${symbol} in ${delay/1000}s after error... (attempt ${retryCount + 1}/${maxRetries})`);
                    await new Promise(resolve => setTimeout(resolve, delay));
                    return fetchPrice(symbol, retryCount + 1);
                }
                
                return 0;
            }
        }

        async function updateValues() {
            try {
                let totalValue = 0;
                
                for (const [symbol, data] of Object.entries(holdings)) {
                    const price = await fetchPrice(symbol);
                    const priceInUSD = price;
                    const holdingValue = data.amount * price;
                    
                    // Display price with appropriate precision
                    // Only update price if valid (not 0)
                    const priceElement = document.getElementById(`${data.id}_price`);
                    const subtotalElement = document.getElementById(`${data.id}_subtotal`);
                    
                    if (price === 0) {
                        // Don't update price or timestamp if price is 0
                        // Keep showing the old price if available
                        if (!priceElement || !priceElement.innerText || 
                            priceElement.innerText === 'Loading...') {
                            if (priceElement) priceElement.innerText = `(Price unavailable)`;
                        }
                        if (subtotalElement) subtotalElement.innerText = '';
                    } else {
                        // Update price only if we got a valid price
                        if (priceElement) priceElement.innerText = `($${formatPrice(priceInUSD)})`;
                        
                        // Display subtotal
                        if (subtotalElement) {
                            subtotalElement.innerText = `Subtotal: $${holdingValue.toLocaleString('en-US', {
                                minimumFractionDigits: 2,
                                maximumFractionDigits: 2
                            })}`;
                        }
                        
                        // Update timestamp for this coin
                        lastUpdateTime[symbol] = Date.now();
                        const updatedElement = document.getElementById(`${data.id}_updated`);
                        if (updatedElement) {
                            updatedElement.innerText = formatElapsedTime(lastUpdateTime[symbol]);
                        }
                    }
                    
                    // Calculate and display price change
                    const changeElement = document.getElementById(`${data.id}_change`);
                    if (changeElement && price !== 0 && previousPrices[symbol] !== undefined && previousPrices[symbol] !== 0) {
                        const priceChange = price - previousPrices[symbol];
                        const percentChange = (priceChange / previousPrices[symbol]) * 100;
                        
                        if (priceChange > 0) {
                            changeElement.innerHTML = `<span class="price-up">▲ $${formatPrice(Math.abs(priceChange))} (+${percentChange.toFixed(2)}%)</span>`;
                        } else if (priceChange < 0) {
                            changeElement.innerHTML = `<span class="price-down">▼ $${formatPrice(Math.abs(priceChange))} (${percentChange.toFixed(2)}%)</span>`;
                        } else {
                            changeElement.innerHTML = `<span style="color: #999;">— No change</span>`;
                        }
                    } else if (changeElement) {
                        changeElement.innerHTML = '';
                    }
                    
                    // Update previous price only if valid
                    if (price !== 0) {
                        previousPrices[symbol] = price;
                    }
                    
                    totalValue += holdingValue;
                }
                
                // Save previous prices to localStorage
                localStorage.setItem('previousPrices', JSON.stringify(previousPrices));
                
                // Display total value in USD
                document.getElementById('total_value').innerText = '$' + totalValue.toLocaleString('en-US', {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                });
                
                // Display total value in CNY
                const totalCNY = totalValue * USD_TO_CNY_RATE;
                document.getElementById('total_cny').innerText = '≈ ¥' + totalCNY.toLocaleString('zh-CN', {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }) + ' CNY';
            } catch (error) {
                console.error('Error updating values:', error);
                document.getElementById('total_value').innerText = 'Error loading';
            }
        }

        function manualRefresh() {
            updateValues();
        }
        
        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            panel.classList.toggle('show');
        }

        loadSettings();
        updateValues();
        startElapsedTimeUpdates(); // Start the elapsed time counter for all coins
    </script>
</body>
</html>
