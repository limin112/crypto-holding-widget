<!DOCTYPE html>
<html>
<head>
    <title>我的持仓Widget</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        #holdingWidget {
            border: 2px solid #333;
            padding: 20px;
            width: 400px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h3 {
            margin-top: 0;
            color: #333;
        }
        .holding-item {
            margin: 15px 0;
            padding: 10px;
            background: #f9f9f9;
            border-left: 4px solid #007368;
            border-radius: 4px;
        }
        .symbol {
            font-weight: bold;
            font-size: 18px;
            color: #007368;
        }
        .value {
            color: #666;
            font-size: 14px;
            margin-left: 10px;
        }
        .total {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px solid #eee;
            font-size: 18px;
            font-weight: bold;
            color: #007368;
        }
        .loading {
            color: #999;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div id="holdingWidget">
        <h3>💰 我的加密资产持仓</h3>
        <div class="holding-item">
            <span class="symbol">ZEC</span>: <span id="zec_amount">200</span>
            <span class="value" id="zec_price" class="loading">加载中...</span>
        </div>
        <div class="holding-item">
            <span class="symbol">BTC</span>: <span id="btc_amount">1</span>
            <span class="value" id="btc_price" class="loading">加载中...</span>
        </div>
        <div class="total">
            总价值（USD）：<span id="total_value" class="loading">加载中...</span>
        </div>
    </div>

    <script>
        async function fetchPrice(symbol) {
            try {
                const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${symbol}&vs_currencies=usd`);
                const data = await res.json();
                return data[symbol].usd;
            } catch (error) {
                console.error('Error fetching price:', error);
                return 'N/A';
            }
        }

        async function updateValues() {
            const zecAmount = 200;
            const btcAmount = 1;

            try {
                const zecPrice = await fetchPrice('zcash');
                const btcPrice = await fetchPrice('bitcoin');

                document.getElementById('zec_price').innerText = `(¥${(zecPrice * 6.5).toFixed(2)})`;
                document.getElementById('btc_price').innerText = `(¥${(btcPrice * 6.5).toFixed(2)})`;

                const totalValue = zecAmount * zecPrice + btcAmount * btcPrice;
                const totalValueCNY = totalValue * 6.5;
                document.getElementById('total_value').innerText = '¥' + totalValueCNY.toLocaleString('zh-CN', {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                });
            } catch (error) {
                console.error('Error updating values:', error);
                document.getElementById('total_value').innerText = '获取失败';
            }
        }

        // 初始化加载
        updateValues();
        // 每30秒自动刷新一次
        setInterval(updateValues, 30000);
    </script>
</body>
</html>
